name: One-time Dart Formatting Repair

on:
  push:
    branches:
      - flutter-mobile-app
    paths:
      - ".github/workflows/format-dart-once.yml"

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: flutter-mobile-app
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Format changed Dart files
        run: dart format lib/main.dart lib/native_organization_management_page.dart
      - name: Commit only canonical formatting
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- mobile/lib/main.dart mobile/lib/native_organization_management_page.dart; then
            echo "Dart files are already formatted."
            exit 0
          fi
          git add mobile/lib/main.dart mobile/lib/native_organization_management_page.dart
          git commit -m "style(mobile): apply Dart formatter"
          git push origin HEAD:flutter-mobile-app
