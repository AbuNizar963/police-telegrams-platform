name: Police Telegrams Flutter Mobile

on:
  push:
    branches:
      - flutter-mobile-app
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-mobile.yml"
  pull_request:
    branches:
      - flutter-mobile-app
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: police-telegrams-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-flutter-mobile:
    name: Verify Flutter mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK output
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          file build/app/outputs/flutter-apk/app-release.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: police-telegrams-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
