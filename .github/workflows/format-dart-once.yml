name: Temporary Dart Formatter Inspection

on:
  push:
    branches:
      - flutter-mobile-app
    paths:
      - ".github/workflows/format-dart-once.yml"

permissions:
  contents: read

jobs:
  format-inspection:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
      - name: Resolve package formatter configuration
        run: flutter pub get
      - name: Format and print changed source files
        run: |
          dart format lib/main.dart lib/native_organization_management_page.dart
          echo "===FILE_MAIN_START==="
          cat lib/main.dart
          echo "===FILE_MAIN_END==="
          echo "===FILE_ORG_START==="
          cat lib/native_organization_management_page.dart
          echo "===FILE_ORG_END==="
