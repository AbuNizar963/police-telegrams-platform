name: Temporary formatter output
on:
  push:
    branches:
      - fix/excel-import-safe-main
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write server/routers.ts
      - name: Emit formatting diff
        shell: bash
        run: git diff -- server/routers.ts
