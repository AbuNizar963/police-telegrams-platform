name: Temporary Dart formatter diagnostic

on:
  pull_request:
    branches:
      - flutter-mobile-app
    paths:
      - "mobile/lib/app_lock.dart"

permissions:
  contents: read

jobs:
  show-formatted-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Print canonical formatted source for review
        working-directory: mobile
        run: dart format --output=show lib/app_lock.dart
