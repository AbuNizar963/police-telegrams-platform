name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Verify formatting
        run: >-
          pnpm exec prettier --check
          .github/workflows/ci.yml
          docs/delivery-report-implementation.md
          api/index.ts
          server/app.ts
          server/api/appRouter.ts
          server/data/database.ts
          server/telegrams.create.test.ts
          client/src/features/operations/pages/OperationsDashboard.tsx
          drizzle/schema.ts

      - name: Verify working tree and migration generation
        run: |
          pnpm drizzle-kit generate
          git diff --exit-code -- drizzle
          git diff --check
