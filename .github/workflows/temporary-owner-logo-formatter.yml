name: Temporary owner logo formatter

on:
  push:
    branches:
      - fix/binary-logo-upload-web-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format owner organization screen
        run: pnpm exec prettier --write client/src/features/organizations/OwnerOrganizationManagement.tsx

      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "File already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/features/organizations/OwnerOrganizationManagement.tsx
          git commit -m "style: format owner organization logo upload"
          git push
