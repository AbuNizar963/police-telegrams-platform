name: Temporary storage test formatting diagnostic

on:
  push:
    branches:
      - fix/shared-organization-logo-web

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier-formatted test file
        run: pnpm exec prettier server/storage.put.test.ts
