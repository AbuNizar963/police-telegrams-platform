name: police_telegrams
description: تطبيق برقيات الشرطة لنظام HADIR
publish_to: 'none'
version: 1.0.113+2
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.21
  cross_file: ^0.3.4+2
  http: ^1.6.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  file_picker: ^11.0.3
  uuid: ^4.5.0
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  share_plus: ^12.0.1
  printing: ^5.14.2
  flutter_native_html_to_pdf: ^3.1.0
  qr: ^3.0.2
  timezone: ^0.10.1
  excel: ^4.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/police-telegrams-icon.png
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo-400.ttf
          weight: 400
        - asset: assets/fonts/cairo-500.ttf
          weight: 500
        - asset: assets/fonts/cairo-600.ttf
          weight: 600
        - asset: assets/fonts/cairo-700.ttf
          weight: 700
