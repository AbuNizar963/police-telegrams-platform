name: Preview formatting diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - "client/src/pages/Home.tsx"
      - ".github/workflows/preview-format-diagnostic.yml"
jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier client/src/pages/Home.tsx > /tmp/Home.formatted.tsx
          diff -u client/src/pages/Home.tsx /tmp/Home.formatted.tsx || true
