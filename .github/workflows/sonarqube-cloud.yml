name: SonarQube Cloud Analysis

on:
  push:
    branches: ["main", "flutter-mobile-app"]
  pull_request:
    branches: ["main", "flutter-mobile-app"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-cloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze web source quality
    if: ${{ vars.SONAR_ORGANIZATION != '' && secrets.SONAR_TOKEN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=AbuNizar963_police-telegrams-platform
