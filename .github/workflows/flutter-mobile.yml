name: Police Telegrams Flutter Mobile

on:
  push:
    branches:
      - flutter-mobile-app
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-mobile.yml"
  pull_request:
    branches:
      - flutter-mobile-app
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-flutter-mobile:
    name: Verify Flutter mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Diagnostic Dart formatter output
        if: always()
        run: dart format --output=show lib/main.dart lib/app_update_service.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  build-android-apk:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release_version.outputs.release_version }}
      release_tag: ${{ steps.release_version.outputs.release_tag }}
    # Fork pull requests do not receive repository secrets. Do not produce
    # an unsigned or debug-signed APK as a substitute for a release artifact.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: release_version
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail

          # Reuse the release tag when this exact workflow run is retried.
          existing_tag="$(git tag --points-at "$GITHUB_SHA" --list "v*-build.${GITHUB_RUN_NUMBER}" | head -n 1 || true)"
          if [ -n "$existing_tag" ]; then
            release_version="${existing_tag#v}"
            release_version="${release_version%-build.*}"
          else
            # Only build tags count as versions already published by this workflow.
            # A newer pubspec version is honored instead of being overwritten by an older tag.
            latest_built_version="$(git tag --list 'v[0-9]*-build.[0-9]*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)-build\.[0-9]+$/\1/p' | sort -V | tail -n 1)"
            pubspec_version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?$/\1/p' mobile/pubspec.yaml | head -n 1)"

            if ! [[ "$pubspec_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Could not determine a valid version from mobile/pubspec.yaml."
              exit 1
            fi

            if [ -z "$latest_built_version" ]; then
              release_version="$pubspec_version"
            else
              newest_version="$(printf '%s\n%s\n' "$latest_built_version" "$pubspec_version" | sort -V | tail -n 1)"
              if [ "$newest_version" != "$latest_built_version" ]; then
                release_version="$pubspec_version"
              else
                IFS='.' read -r major minor patch <<< "$latest_built_version"
                release_version="${major}.${minor}.$((patch + 1))"
              fi
            fi
          fi

          release_tag="v${release_version}-build.${GITHUB_RUN_NUMBER}"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Release version: $release_version"
          echo "Release tag: $release_tag"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required Android release signing secret $name is missing."
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/police-telegrams-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          test -s "$keystore_path"

          # Validate the keystore password and alias without printing secret values.
          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.release_version }}
        run: flutter build apk --release --build-name "$RELEASE_VERSION" --build-number "$GITHUB_RUN_NUMBER"

      - name: Verify APK output and signature
        run: |
          set -euo pipefail

          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          file "$apk"

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "::error::Android apksigner was not found in the installed SDK."
            exit 1
          fi

          "$apksigner_path" verify --verbose "$apk"
          "$apksigner_path" verify --print-certs "$apk"

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/police-telegrams-release.jks"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: police-telegrams-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Verify iOS build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify iOS build without signing
        run: flutter build ios --release --no-codesign
  publish-mobile-release:
    name: Publish Android APK Release
    runs-on: ubuntu-latest
    needs:
      - verify-flutter-mobile
      - build-android-apk
      - build-ios
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: police-telegrams-android-apk
          path: release-assets

      - name: Verify release asset and generate checksum
        run: |
          set -euo pipefail
          test -s release-assets/app-release.apk
          file release-assets/app-release.apk
          sha256sum release-assets/app-release.apk | tee release-assets/SHA256SUMS.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android-apk.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Police Telegrams ${{ needs.build-android-apk.outputs.release_version }} (build ${{ github.run_number }})
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-assets/app-release.apk
            release-assets/SHA256SUMS.txt

