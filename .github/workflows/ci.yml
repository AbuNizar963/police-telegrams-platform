name: CI

on:
  push:
    branches: ["flutter-mobile-app"]
  pull_request:
    branches: ["flutter-mobile-app"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject legacy platform dependencies
        run: |
          if git grep -niE 'vite-plugin-manus-runtime|BUILT_IN_FORGE|VITE_FRONTEND_FORGE|OAUTH_SERVER_URL|VITE_OAUTH_PORTAL_URL|OWNER_OPEN_ID|MANUS_|__MANUS__|manus' -- ':!pnpm-lock.yaml' ':!.github/workflows/ci.yml'; then
            echo "Legacy platform dependency detected"
            exit 1
          fi

      - name: Check formatting for changed files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --no-tags origin "$PR_BASE_SHA" "$PR_HEAD_SHA"
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "$PR_BASE_SHA" "$PR_HEAD_SHA" -- \
              'client/**/*.ts' \
              'client/**/*.tsx' \
              'client/**/*.css' \
              'client/**/*.json' \
              'client/**/*.md' \
              'server/**/*.ts' \
              'shared/**/*.ts' \
              'scripts/**/*.mjs' \
              'drizzle/**/*.ts' \
              'package.json'
          )
          if (("${#changed_files[@]}" == 0)); then
            echo "No changed files are covered by the Prettier check."
            exit 0
          fi
          pnpm exec prettier --check "${changed_files[@]}"

      - name: Verify responsive application shell
        run: pnpm check:responsive-shell

      - name: Type check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Pin to the latest maintained v2 release; CLI v3 has breaking CI semantics.
          version: 2.122.1

      - name: Start local Supabase services
        run: supabase start -x studio,edge-runtime,logflare,vector

      - name: Apply migrations to local database
        run: supabase db reset

      - name: Run database tests
        run: supabase test db

      - name: Verify concurrent organization and settings writes
        run: |
          set -a
          eval "$(supabase status --output env)"
          set +a
          node scripts/test-organization-management-concurrency.mjs

      - name: Production build
        run: pnpm build

      - name: Vercel configuration validation
        run: node -e "const fs=require('node:fs'); const c=JSON.parse(fs.readFileSync('vercel.json','utf8')); if(c.framework!=='vite'||c.outputDirectory!=='dist/public'||!fs.existsSync('api/[...].ts')) process.exit(1); const apiRules=(c.rewrites||[]).filter(r=>r.source==='/api'||r.source==='/api/:path*'); if(apiRules.length!==2) process.exit(1); console.log('Vercel configuration is valid');"
