name: Police Telegrams Flutter Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - flutter-mobile-app
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-mobile.yml"
  pull_request:
    branches:
      - flutter-mobile-app
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-mobile.yml"

permissions:
  contents: read

concurrency:
  group: police-telegrams-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Verify and build Flutter mobile app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Generate APK checksum
        run: cd build/app/outputs/flutter-apk && sha256sum app-release.apk > SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: police-telegrams-android-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish verified Android release
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/flutter-mobile-app' && contains(github.event.head_commit.message, 'release-mobile')
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: police-telegrams-android-apk
          path: mobile/build/app/outputs/flutter-apk

      - name: Read app version
        id: version
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          VERSION_LINE="$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')"
          if [[ -z "$VERSION_LINE" || "$VERSION_LINE" != *+* ]]; then
            echo "Expected pubspec.yaml version in <version>+<build> format" >&2
            exit 1
          fi
          VERSION="${VERSION_LINE%%+*}"
          BUILD="${VERSION_LINE##*+}"
          if [[ -z "$VERSION" || -z "$BUILD" ]]; then
            echo "Invalid app version in pubspec.yaml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build.${BUILD}" >> "$GITHUB_OUTPUT"

      - name: Verify downloaded APK checksum
        working-directory: mobile/build/app/outputs/flutter-apk
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Police Telegrams ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build }})
          body: |
            Android APK built from the latest flutter-mobile-app branch code.

            Build commit: ${{ github.sha }}
            SHA-256 checksum is included as SHA256SUMS.txt.
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt
          generate_release_notes: true
