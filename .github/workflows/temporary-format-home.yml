name: Temporary Home.tsx formatter
on:
  push:
    branches:
      - fix/print-logo-watermark-image-readiness
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/fix/print-logo-watermark-image-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/print-logo-watermark-image-readiness
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format the affected source file
        run: pnpm exec prettier --write client/src/pages/Home.tsx
      - name: Commit formatter output
        run: |
          if git diff --quiet -- client/src/pages/Home.tsx; then
            echo "Home.tsx already matches Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Home.tsx
          git commit -m "style: format Home.tsx with repository Prettier"
          git push origin HEAD:fix/print-logo-watermark-image-readiness
