name: Temporary binary logo formatter

on:
  push:
    branches:
      - fix/binary-logo-upload-web-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files with repository Prettier
        run: >-
          pnpm exec prettier --write
          client/src/features/organizations/organizationLogoUpload.ts
          server/features/storage/storageRoutes.ts

      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "Files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/features/organizations/organizationLogoUpload.ts server/features/storage/storageRoutes.ts
          git commit -m "style: apply repository Prettier formatting"
          git push
