name: Bug report
description: Report a reproducible problem without sharing sensitive data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Before submitting, remove passwords, tokens, personal information, and production records from all examples."
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Web
        - Flutter Android
        - Flutter iOS
        - Authentication and permissions
        - Telegram import/export
        - Organization settings and logo
        - Database or deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use test data only; do not include private production records.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and relevant Actions run
      description: Browser/device, app version, branch/commit, and run URL if available.
    validations:
      required: false
