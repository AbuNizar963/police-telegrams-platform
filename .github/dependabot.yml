version: 2
# Routine version updates are disabled to avoid automatic branch churn.
# GitHub security alerts and security updates remain enabled separately.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    versioning-strategy: increase
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      production-and-development-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
